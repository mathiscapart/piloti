name: CI

# `push` est limité aux branches de livraison, toute autre branche est vérifiée
# par `pull_request` (PR internes, Dependabot, forks). Avant, un push sur une
# branche de PR déclenchait `push` ET `pull_request`, deux runs identiques que
# `concurrency` ne regroupait pas (groupes différents). Reste un doublon voulu :
# un push sur `develop` pendant qu'une PR `develop` → `main` est ouverte
# (le run `push` vérifie develop, le run `pull_request` vérifie la fusion).
# Une branche sans PR n'est plus vérifiée automatiquement : `workflow_dispatch`
# permet de lancer la CI à la main sur n'importe quelle branche.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# Annule les runs obsolètes d'une même PR quand un nouveau push arrive. Jamais
# sur develop/main : un run coupé entre la création du tag de version et la
# publication de l'image laisserait une version sans image. GitHub n'y garde
# qu'un run en attente par branche : un run intermédiaire en attente est annulé
# par le suivant (le commit plus récent le contient).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN en lecture seule : aucun job ci-dessous ne pousse de commit,
# de tag, ni n'écrit sur les Pull Requests. Seule exception : le job `release`
# (D-050), qui pose le tag de version et crée la Release (`contents: write`).
permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      # `prisma.config.ts` appelle env("DATABASE_URL") au chargement — nécessaire
      # y compris pour `prisma generate`, qui ne se connecte jamais réellement à
      # une base. `src/lib/auth.ts` plante volontairement (fail-fast) si
      # BETTER_AUTH_SECRET est absent. Aucune de ces deux valeurs n'est une vraie
      # base/un vrai secret : le build Next.js ne fait que du SSR à la demande
      # (aucune page ne requête la DB au moment du build), ces placeholders
      # suffisent et ne servent jamais à une authentification réelle.
      DATABASE_URL: "file:./ci-build.db"
      BETTER_AUTH_SECRET: "ci-build-placeholder-non-secret-0000000000000000"
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Génération du client Prisma
        run: pnpm db:generate

      # Garde-fou anti-régression P3018 : une migration non rejouable sur base
      # vierge (table/colonne déjà créée par une migration précédente, etc.)
      # passe inaperçue sur la prod baselinée (qui ne rejoue jamais l'historique
      # complet) mais fait tomber `migrate deploy` sur un déploiement neuf.
      # On rejoue donc tout l'historique sur une base SQLite jetable, puis on
      # vérifie qu'aucune dérive ne subsiste entre les migrations et
      # `schema.prisma` (une divergence indiquerait un schéma modifié sans
      # migration correspondante, ou une migration qui ne reconstruit pas
      # fidèlement le schéma). Placé juste après `prisma generate` : c'est une
      # vérification de la couche base de données, indépendante du lint/tsc/
      # build applicatifs, et rapide à faire échouer en premier sur SQLite.
      - name: Migrations Prisma rejouables sur base vierge
        env:
          DATABASE_URL: "file:./ci-migrate-check.db"
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Vérification des types (tsc)
        run: pnpm typecheck

      # Avant le build : ce sont des tests unitaires de logique pure (aucune
      # dépendance au build Next.js), plus rapides à faire échouer que
      # d'attendre `pnpm build` pour un bug qu'un test aurait déjà signalé.
      - name: Tests unitaires (Vitest)
        run: pnpm test

      - name: Build (Next.js)
        run: pnpm build

  security:
    name: Sécurité (secrets, dépendances, SAST)
    runs-on: ubuntu-latest
    steps:
      # Historique complet : gitleaks scanne les commits, pas juste l'arbre courant.
      - name: Récupération du code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Détection de secrets commités. On invoque le binaire gitleaks (OSS,
      # MIT) directement via son image Docker officielle plutôt que via
      # l'action `gitleaks/gitleaks-action`, qui exige une licence payante dès
      # qu'elle tourne sur un dépôt privé — ce repo l'est probablement.
      # `detect` (sans `--no-git`) parcourt l'historique des commits suivis
      # par git, ce qui exclut naturellement node_modules/.pnpm-store.
      - name: Scan de secrets (gitleaks)
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source=. --redact -v

      - name: Installation de pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: "Audit des dépendances — bloquant (critical)"
        run: pnpm audit --audit-level=critical

      # Rapport informatif, non bloquant : rend visibles les vulnérabilités
      # moderate/high dans les logs sans casser la CI. À remonter en bloquant
      # dès qu'un correctif amont existe pour les entrées actuelles.
      - name: "Audit des dépendances — rapport (moderate+), non bloquant"
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      # SAST sur le code TS/TSX applicatif. `semgrep-action` (le wrapper
      # GitHub Marketplace) est archivé/déprécié depuis 2024 ; on invoque donc
      # directement l'image Docker officielle et maintenue `semgrep/semgrep`.
      # L'image `semgrep/semgrep` ne définit pas d'entrypoint (contrairement à
      # celle de gitleaks) : `args` est donc pris comme commande complète et
      # doit commencer par le binaire `semgrep`, sans quoi Docker cherche un
      # exécutable nommé `scan`.
      # Rulesets publics (`p/security-audit`, `p/typescript`, `p/react`),
      # `--metrics=off` : aucun compte, aucun token Semgrep App requis.
      # Scan de référence à la rédaction de ce workflow : 0 finding sur les
      # 394 fichiers suivis par git — bloquant dès le départ.
      - name: SAST (semgrep)
        uses: docker://semgrep/semgrep:1.170.0
        with:
          args: >-
            semgrep scan --config=p/security-audit --config=p/typescript --config=p/react
            --metrics=off --error --exclude=node_modules --exclude=.next

  # Version (D-050) : sur un push sur main uniquement, une fois Qualité et
  # Sécurité vertes. semantic-release lit les commits conventionnels depuis le
  # dernier tag (fix → patch, feat → mineure, BREAKING CHANGE → majeure), crée
  # le tag vX.Y.Z et la Release GitHub avec ses notes. Aucun commit n'est poussé
  # sur main (ni CHANGELOG.md ni version de package.json) : develop et main
  # restent alignés. Les commentaires et labels sur les PR et issues sont
  # désactivés (.releaserc.json), d'où `contents: write` seul.
  release:
    name: Version (semantic-release)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Historique et tags complets : semantic-release part du dernier tag.
      - name: Récupération du code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Outillage isolé dans .github/release (lockfile figé par empreintes,
      # aucun script d'installation exécuté) : pas une dépendance de l'app.
      - name: Installation de semantic-release
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      - name: Calcul et publication de la version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release

      # Version portée par le commit courant, vide si ce push ne justifie
      # aucune version (que des chore/docs/test/refactor).
      - name: Version créée
        id: version
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Version : ${tag:-aucune}"

  # Images de prod (D-050) : `runner` (l'app) et `migrate` (migrations), les
  # deux cibles que `docker compose build` construit en prod. Sur une PR, on
  # construit seulement : l'image cassée (sharp/libvips, better-sqlite3 sous
  # Alpine, fichiers exclus par .dockerignore) se voit avant le déploiement.
  # Sur un push sur develop/main, les images construites sont transmises au job
  # `publish`. Ce job n'a aucun secret : le build exécute le code du dépôt.
  # deploy.ps1 continue de construire sur l'hôte (D-018) : rien ne tire encore
  # ces images.
  image:
    name: Image Docker (runner, migrate)
    needs: [quality, security, release]
    # `release` est sauté hors de main : seuls `success` et `skipped` passent
    # (un `release` annulé ou expiré a pu poser un tag sans finir).
    if: >-
      !cancelled()
      && needs.quality.result == 'success'
      && needs.security.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupération du code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Même version de Node qu'en prod : NODE_IMAGE_TAG de .env.example (D-043).
      - name: Build des images
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          node_tag=$(sed -nE 's/^NODE_IMAGE_TAG="?([^"]+)"?$/\1/p' .env.example)
          test -n "$node_tag"
          for target in runner migrate; do
            docker build --target "$target" \
              --build-arg NODE_IMAGE_TAG="$node_tag" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label org.opencontainers.image.version="${VERSION:-sha-${GITHUB_SHA::7}}" \
              -t "piloti-$target:ci" .
          done

      - name: Export des images pour la publication
        if: github.event_name == 'push'
        run: docker save piloti-runner:ci piloti-migrate:ci | gzip -1 > images.tar.gz

      - name: Transmission des images au job de publication
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0

  # Publication Docker Hub (D-050), sans rebuild : les images sont celles
  # construites par `image`. Le jeton vit dans l'environnement GitHub
  # `dockerhub`, restreint aux branches develop et main : une PR ou un
  # workflow_dispatch sur une autre branche ne peut pas l'obtenir, même avec un
  # ci.yml modifié. Aucun code du dépôt n'est exécuté ici (pas de checkout).
  publish:
    name: Publication Docker Hub
    needs: [image, release]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dockerhub
    steps:
      - name: Récupération des images
        uses: actions/download-artifact@v8
        with:
          name: images

      # Tags immuables, toujours poussés : sha-<commit>, et X.Y.Z quand
      # `release` a créé une version. Tags mobiles, jamais reculés par un
      # re-run d'un ancien run : le nom de branche seulement si ce commit en
      # est encore la pointe ; X.Y et latest seulement si X.Y.Z est la plus
      # haute version du dépôt.
      # Publication bloquante : sans identifiants, le run échoue au lieu de
      # sauter la publication en silence.
      - name: Publication sur Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Variable DOCKERHUB_USERNAME ou secret DOCKERHUB_TOKEN absent de l'environnement dockerhub (Settings > Environments)."
            exit 1
          fi
          set -o pipefail
          gunzip -c images.tar.gz | docker load
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          tags="sha-${GITHUB_SHA::7}"
          tip=$(git ls-remote "$url" "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test -n "$tip"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            tags="$tags $GITHUB_REF_NAME"
          else
            echo "::warning::$GITHUB_SHA n'est plus la pointe de $GITHUB_REF_NAME : tag $GITHUB_REF_NAME non mis à jour."
          fi
          if [ -n "$VERSION" ]; then
            tags="$tags $VERSION"
            highest=$(git ls-remote --tags --refs "$url" 'v*' | sed 's#.*refs/tags/v##' | sort -V | tail -n 1)
            test -n "$highest"
            if [ "$VERSION" = "$highest" ]; then
              tags="$tags ${VERSION%.*} latest"
            else
              echo "::warning::$VERSION n'est pas la plus haute version ($highest) : X.Y et latest non mis à jour."
            fi
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          for target in runner migrate; do
            repo="$DOCKERHUB_USERNAME/piloti"
            if [ "$target" = migrate ]; then repo="$repo-migrate"; fi
            for tag in $tags; do
              docker tag "piloti-$target:ci" "$repo:$tag"
              docker push "$repo:$tag"
            done
          done
          docker logout
