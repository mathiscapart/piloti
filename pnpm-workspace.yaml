allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# SEC — Next tire `sharp` en dépendance optionnelle (optimiseur d'images) et
# reste sur une 0.34.x vulnérable (GHSA-f88m-g3jw-g9cj, décodeurs GIF/TIFF/VIPS).
# Notre dépendance directe est déjà en 0.35.x : cet override aligne aussi la
# copie transitive, sinon deux versions coexistent et la faille reste servie.
overrides:
  sharp: '>=0.35.0'
  # Avis `pnpm audit` restants, tous transitifs (chaîne ESLint, outillage de
  # build, serveur de dev Prisma). Aucun n'est atteignable depuis l'application
  # déployée, mais on aligne quand même pour garder l'audit lisible : un rapport
  # bruyant finit par ne plus être lu.
  #
  # `brace-expansion` vit en deux lignes majeures incompatibles (1.x et 5.x)
  # selon le consommateur — d'où deux clés ciblées plutôt qu'un `>=` global qui
  # basculerait les consommateurs de la 1.x vers une API différente.
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@5': '^5.0.9'
  js-yaml: '^4.3.1'
  nanoid: '^3.3.18'
  postcss: '^8.5.18'
  fast-uri: '^3.1.5'
  hono: '^4.12.34'
  # Saut de MAJEURE (7.x → 8.x) imposé à une dépendance de `@prisma/dev` : c'est
  # l'override le plus risqué du lot, à retirer en premier si l'install casse.
  deepmerge-ts: '^8.0.0'
