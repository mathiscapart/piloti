# Piloti — middlewares Traefik (chargés via providers.file).
# Référencés dans docker-compose.yml par `security-headers@file`.

http:
  middlewares:
    security-headers:
      headers:
        # HSTS : force HTTPS via Cloudflare. La terminaison TLS est faite par
        # l'edge Cloudflare ; le tunnel + Traefik voient HTTP côté serveur.
        # On envoie quand même le header car le navigateur lit en HTTPS.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true

        # Anti-clickjacking + sniffing
        frameDeny: true
        contentTypeNosniff: true

        # Referrer policy stricte (jamais exposer le chemin complet au tiers)
        referrerPolicy: "strict-origin-when-cross-origin"

        # CSP minimaliste — adapter quand on ajoutera des CDN externes.
        # img-src : tuiles de carte (US-L02) — Esri (satellite), Carto (plan),
        #   OSM. frame-src : carte OSM embarquée de la fiche lieu (US-L03).
        contentSecurityPolicy: >-
          default-src 'self';
          img-src 'self' data: blob: https://*.arcgisonline.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org;
          font-src 'self' https://fonts.gstatic.com data:;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          script-src 'self' 'unsafe-inline';
          connect-src 'self';
          frame-src https://www.openstreetmap.org;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';

        # Désactive l'API de géolocalisation/caméra/micro par défaut (à
        # affiner si on a besoin de la caméra mobile pour upload incident —
        # l'input type=file capture="environment" ne passe pas par Permissions-Policy)
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"

        # X-Powered-By etc. → on les neutralise
        customResponseHeaders:
          server: ""
          x-powered-by: ""
          # Isolation cross-origin. Sûr ici : la CSP est déjà en `default-src
          # 'self'`, l'authentification est en email/mot de passe (aucune popup
          # OAuth à préserver) et aucune ressource n'est chargée depuis une
          # autre origine que les tuiles de carte (images, non concernées).
          cross-origin-opener-policy: "same-origin"
          cross-origin-resource-policy: "same-origin"

    # Rate limit global. better-auth plafonne déjà login/signup, mais rien ne
    # protégeait les uploads, les exports, le SSE ni les Server Actions — tout
    # entre par ici, c'est donc le seul endroit où poser une limite globale.
    #
    # `sourceCriterion.requestHeaderName: Cf-Connecting-Ip` : derrière
    # cloudflared, TOUTES les requêtes portent l'IP du tunnel. Sans ce réglage,
    # Traefik compte tout le trafic sur une seule source et le premier
    # utilisateur actif épuiserait le quota de tout le groupe.
    #
    # Valeurs volontairement TRÈS larges : on vise l'abus automatisé (qui fait
    # des milliers de requêtes), jamais la navigation humaine. Les photos
    # d'incidents sont servies en `no-store` : une galerie recharge toutes ses
    # images à chaque affichage, donc une consultation normale génère beaucoup
    # plus de requêtes qu'on ne l'imagine. Un 429 intermittent serait pénible à
    # diagnostiquer — mieux vaut une limite lâche qui tient que stricte qui gêne.
    rate-limit:
      rateLimit:
        average: 300
        period: 1m
        burst: 100
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip
